name: Build exact LP equilibria

on:
  push:
    branches: [main]
    paths:
      - 'sequence_form_lp.py'
      - '.github/workflows/build-exact-equilibria.yml'
  workflow_dispatch:
    inputs:
      hidden:
        description: '1-based mystery cells, comma separated'
        required: true
        default: '2,4'

permissions:
  contents: write

concurrency:
  group: exact-equilibrium-build
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HIDDEN: ${{ inputs.hidden || '2,4' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install solver dependencies
        run: python -m pip install --upgrade numpy scipy

      - name: Compute configuration key
        id: config
        shell: bash
        run: |
          MASK=$(python - <<'PY'
          import os
          cells=sorted({int(x.strip()) for x in os.environ['HIDDEN'].split(',') if x.strip()})
          if len(cells) < 2 or any(c < 1 or c > 9 for c in cells):
              raise SystemExit('hidden must contain at least two cells in 1..9')
          print(sum(1 << (c-1) for c in cells))
          PY
          )
          echo "mask=$MASK" >> "$GITHUB_OUTPUT"
          echo "Solving hidden=$HIDDEN mask=$MASK"

      - name: Solve exact policy when O opens
        run: |
          mkdir -p web/equilibria
          python sequence_form_lp.py \
            --hidden "$HIDDEN" \
            --start O \
            --output "web/equilibria/mask-${{ steps.config.outputs.mask }}-O.json"

      - name: Solve exact policy when X opens
        run: |
          python sequence_form_lp.py \
            --hidden "$HIDDEN" \
            --start X \
            --output "web/equilibria/mask-${{ steps.config.outputs.mask }}-X.json"

      - name: Build browser manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('web/equilibria')
          artifacts = []
          for path in sorted(root.glob('mask-*.json')):
              data = json.loads(path.read_text())
              artifacts.append({
                  'file': path.name,
                  'hiddenMask': data['hiddenMask'],
                  'hidden': data['hidden'],
                  'startPlayer': data['startPlayer'],
                  'valueO': data['valueO'],
                  'dualityGap': data['dualityGap'],
                  'numericallySolved': data['numericallySolved'],
              })
          (root / 'manifest.json').write_text(json.dumps({'schema': 1, 'artifacts': artifacts}, separators=(',', ':')))
          print(f'Published manifest with {len(artifacts)} exact policies')
          PY

      - name: Commit certified policy artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/equilibria
          if git diff --cached --quiet; then
            echo 'No equilibrium artifact changes.'
            exit 0
          fi
          git commit -m "Publish exact LP equilibrium for hidden $HIDDEN"
          git push
