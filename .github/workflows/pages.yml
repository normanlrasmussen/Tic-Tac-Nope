name: Deploy Tic-Tac-Nope Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'game_theory_validation.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate game-theory engine and static browser code
        run: |
          node game_theory_validation.js
          node --check web/app4.js
          node --check web/app4-core.js
          node --check web/lp-strategy-extension.js
          node --check web/lp-first-ordering.js
          node --check web/best-tie-highlights.js
          node --check web/coach-all-strategies.js
          node --check web/nash-benchmark.js
          node --check web/ux-refresh.js
          grep -q 'id="page-home"' web/index.html
          grep -q 'id="local-board"' web/index.html
          grep -q 'id="simulation-config"' web/index.html
          test -f web/site-refresh.css
          test -f web/legacy-reset.css
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path('web/index.html').read_text()
          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = sorted({value for value in ids if ids.count(value) > 1})
          if duplicates:
              raise SystemExit(f'Duplicate HTML ids: {duplicates}')
          for attr, target in re.findall(r'\b(src|href)="(\./[^"]+)"', html):
              clean = target.split('#', 1)[0].split('?', 1)[0]
              if not clean or clean.endswith('/'):
                  continue
              path = pathlib.Path('web') / clean.removeprefix('./')
              if not path.exists():
                  raise SystemExit(f'Missing local asset referenced by {attr}: {target}')
          print(f'HTML integrity OK: {len(ids)} unique ids and local assets resolved.')
          PY

      - name: Render critical pages in headless Chrome
        run: |
          python -m http.server 8765 -d web >/tmp/ttn-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.25
          done
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom 'http://127.0.0.1:8765/#home' >/tmp/home.html 2>/tmp/home-browser.log
          grep -q 'Tic-tac-toe' /tmp/home.html
          grep -q 'Play together' /tmp/home.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom 'http://127.0.0.1:8765/#play' >/tmp/play.html 2>/tmp/play-browser.log
          grep -q 'All · compare every strategy' /tmp/play.html
          ! grep -q 'Position Lab' /tmp/play.html
          python - <<'PY'
          import pathlib
          html = pathlib.Path('/tmp/play.html').read_text()
          decision_start = html.index('id="decision-strategy"')
          decision_end = html.index('</select>', decision_start)
          decision = html[decision_start:decision_end]
          lp = decision.index('value="lp"')
          belief = decision.index('value="belief"')
          if lp > belief:
              raise SystemExit('Exact LP must appear before Belief Search in the Coach strategy selector')
          if 'data-current-strategy="lp"' not in decision or 'data-default-exact="true"' not in decision:
              raise SystemExit('AI + Coach must actually select Exact LP by default')

          ai_start = html.index('id="ai-strategy"')
          ai_end = html.index('</select>', ai_start)
          ai = html[ai_start:ai_end]
          if ai.index('value="lp"') > ai.index('value="belief"'):
              raise SystemExit('Exact LP must appear before Belief Search in the AI strategy selector')
          if 'data-current-strategy="lp"' not in ai or 'data-default-exact="true"' not in ai:
              raise SystemExit('Play vs AI must actually select Exact LP by default')
          print('Exact LP is first and selected by default in both Play strategy selectors.')
          PY
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom 'http://127.0.0.1:8765/#strategies' >/tmp/strategies.html 2>/tmp/strategies-browser.log
          grep -q 'How each strategy thinks.' /tmp/strategies.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom 'http://127.0.0.1:8765/#nash' >/tmp/nash.html 2>/tmp/nash-browser.log
          grep -q 'The exact Nash equilibrium.' /tmp/nash.html
          grep -q 'class="nash-number"' /tmp/nash.html
          ! grep -q 'Position Lab' /tmp/nash.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4